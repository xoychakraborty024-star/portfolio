<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PeakSanima/title>
<meta name="description" content="Portfolio of Joy Chakrabarty (PeakSanima) — Director, DOP & Assistant Director based in Delhi, specialising in campaign films, motion, and brand stills.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0A0A;
    --paper:#EDEDE7;
    --ink:#0A0A0A;
    --alarm:#FF2E00;
    --grey:#8C8C86;
    --line:#3A3A3A;
    --glass:rgba(237,237,231,0.05);
    --glass-strong:rgba(237,237,231,0.12);
    --glass-border:rgba(237,237,231,0.18);
    --glass-blur:20px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--paper);
    font-family:'JetBrains Mono', monospace;
    overflow-x:hidden;
    position:relative;
  }
  body.no-cursor{cursor:none;}
  
  /* Film Grain Overlay */
  body::before {
    content: "";
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    pointer-events: none;
    z-index: 9000;
    opacity: 0.035;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
  }

  h1,h2,h3, .display{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    letter-spacing:-0.01em;
    line-height:0.95;
    text-transform:uppercase;
  }
  a{color:inherit;text-decoration:none;}
  ::selection{background:var(--alarm);color:var(--bg);}
  button{cursor:pointer; background:none; border:none; color:inherit; font-family:inherit;}

  .eyebrow{
    font-size:11px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--grey);
  }

  .glass{
    background:var(--glass);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(var(--glass-blur)) saturate(160%);
    -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(160%);
  }

  /* ---------- CUSTOM GLASS CURSOR ---------- */
  .cursor-dot{
    position:fixed; width:6px; height:6px; border-radius:50%;
    background:var(--alarm); pointer-events:none; z-index:9999;
    transform:translate(-50%,-50%); opacity:0; transition:opacity .2s ease;
  }
  .cursor-ring{
    position:fixed; width:42px; height:42px; border-radius:50%;
    border:1px solid var(--glass-border); background:var(--glass);
    backdrop-filter:blur(8px) saturate(160%); -webkit-backdrop-filter:blur(8px) saturate(160%);
    pointer-events:none; z-index:9998; transform:translate(-50%,-50%);
    transition:width .3s cubic-bezier(.2,.9,.3,1), height .3s cubic-bezier(.2,.9,.3,1),
               background .3s ease, border-color .3s ease, opacity .2s ease;
    display:flex; align-items:center; justify-content:center;
    font-size:9px; letter-spacing:.12em; color:var(--paper); opacity:0;
    font-weight:700;
  }
  .cursor-ring.active{opacity:1;}
  .cursor-ring.hover{width:90px; height:90px; background:var(--glass-strong); border-color:var(--alarm);}
  .cursor-ring.hover span{opacity:1;}
  .cursor-ring span{opacity:0; transition:opacity .2s ease;}

  /* ---------- REVEAL ON SCROLL ---------- */
  .reveal{opacity:0; transform:translateY(28px); transition:opacity .7s cubic-bezier(.2,.7,.2,1), transform .7s cubic-bezier(.2,.7,.2,1);}
  .reveal.in-view{opacity:1; transform:translateY(0);}

  /* ---------- HEADER ---------- */
  header{
    position:fixed; top:0; left:0; right:0; z-index:100;
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 28px;
    border-bottom:1px solid var(--glass-border);
    background:rgba(10,10,10,0.65);
    backdrop-filter:blur(var(--glass-blur)) saturate(160%);
    -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(160%);
    gap: 16px;
  }
  .logo{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700; font-size:17px; letter-spacing:0.02em;
    text-transform:uppercase; line-height:1.3;
  }
  .logo span{color:var(--alarm);}
  nav{display:flex; gap:26px; align-items:center;}
  nav a{
    font-size:11px; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--paper); position:relative; padding-bottom:2px;
  }
  nav a::after{
    content:""; position:absolute; left:0; bottom:-3px; width:0; height:1px;
    background:var(--alarm); transition:width .25s ease;
  }
  nav a:hover::after{width:100%;}
  
  .header-actions {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .rec-tag{
    display:flex; align-items:center; gap:8px;
    font-size:11px; letter-spacing:0.1em; color:var(--grey);
  }
  .rec-dot{
    width:8px; height:8px; border-radius:50%; background:var(--alarm);
    box-shadow: 0 0 8px var(--alarm);
    animation:blink 1.4s steps(1) infinite;
  }
  @keyframes blink{50%{opacity:0.15;}}

  /* ---------- BGM AUDIO CONTROL WIDGET ---------- */
  .bgm-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 10px;
    letter-spacing: 0.12em;
    padding: 6px 12px;
    border: 1px solid var(--glass-border);
    background: var(--glass);
    color: var(--paper);
    border-radius: 20px;
    transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .bgm-btn:hover {
    border-color: var(--alarm);
    background: var(--glass-strong);
  }
  .bgm-btn.active {
    border-color: var(--alarm);
    background: rgba(255, 46, 0, 0.12);
    box-shadow: 0 0 12px rgba(255, 46, 0, 0.25);
  }
  .bgm-btn .bgm-text {
    font-weight: 700;
    text-transform: uppercase;
  }
  .bgm-btn.active .bgm-text {
    color: var(--alarm);
  }
  .sound-bars {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    height: 12px;
    width: 14px;
  }
  .sound-bars .bar {
    width: 2px;
    height: 25%;
    background: var(--grey);
    border-radius: 1px;
    transition: height 0.2s ease, background 0.3s ease;
  }
  .bgm-btn.active .sound-bars .bar {
    background: var(--alarm);
    animation: soundWave 1.2s infinite ease-in-out alternate;
  }
  .bgm-btn.active .sound-bars .bar:nth-child(1) { animation-delay: 0.1s; }
  .bgm-btn.active .sound-bars .bar:nth-child(2) { animation-delay: 0.35s; }
  .bgm-btn.active .sound-bars .bar:nth-child(3) { animation-delay: 0.2s; }
  .bgm-btn.active .sound-bars .bar:nth-child(4) { animation-delay: 0.45s; }

  @keyframes soundWave {
    0% { height: 20%; }
    50% { height: 100%; }
    100% { height: 35%; }
  }

  .menu-btn{display:none; background:none; border:1px solid var(--glass-border); color:var(--paper); font-family:inherit; font-size:11px; padding:8px 12px; letter-spacing:.1em;}

  /* ---------- MOBILE GLASS MENU ---------- */
  .mobile-menu{
    position:fixed; inset:0; z-index:200;
    display:flex; flex-direction:column; align-items:flex-start; justify-content:center;
    gap:26px; padding:40px;
    background:rgba(10,10,10,0.85);
    backdrop-filter:blur(26px) saturate(160%); -webkit-backdrop-filter:blur(26px) saturate(160%);
    opacity:0; pointer-events:none; transform:translateY(-12px);
    transition:opacity .35s ease, transform .35s ease;
  }
  .mobile-menu.open{opacity:1; pointer-events:auto; transform:translateY(0);}
  .mobile-menu a{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:32px; text-transform:uppercase;}
  .mobile-menu-close{position:absolute; top:22px; right:22px; background:none; border:1px solid var(--glass-border); color:var(--paper); font-family:inherit; font-size:11px; padding:8px 12px; letter-spacing:.1em;}

  /* ---------- HERO ---------- */
  .hero{
    position:relative;
    min-height:100vh;
    display:flex; flex-direction:column; justify-content:flex-end;
    padding:140px 28px 40px;
    border-bottom:1px solid var(--line);
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:33.33% 33.33%;
    background-position:0 0;
  }
  .hero-frame-label{
    position:absolute; top:100px; left:28px;
    font-size:11px; color:var(--grey); letter-spacing:.14em;
  }
  .hero-frame-label.right{left:auto; right:28px; text-align:right;}
  .hero-frame-label b{color:var(--paper);}
  .hero h1{
    font-size:clamp(48px, 10vw, 148px);
    max-width:1200px;
  }
  .hero h1 .accent{color:var(--alarm);}
  .hero-sub{
    display:flex; justify-content:space-between; align-items:flex-end;
    margin-top:26px; padding-top:18px; border-top:1px solid var(--line);
    gap:20px; flex-wrap:wrap;
  }
  .hero-sub p{
    max-width:460px; font-size:13px; line-height:1.6; color:#C9C9C1;
  }
  .scroll-cue{font-size:11px; letter-spacing:.14em; color:var(--grey); white-space:nowrap;}

  /* Viewfinder Brackets & Lens */
  .bracket{
    position:fixed; width:26px; height:26px; pointer-events:none; z-index:60;
    border-color:var(--alarm); opacity:0; transition:opacity .2s ease;
  }
  .bracket.tl{border-top:2px solid; border-left:2px solid;}
  .bracket.tr{border-top:2px solid; border-right:2px solid;}
  .bracket.bl{border-bottom:2px solid; border-left:2px solid;}
  .bracket.br{border-bottom:2px solid; border-right:2px solid;}
  .lens{
    position:fixed; width:180px; height:180px; border-radius:50%;
    pointer-events:none; z-index:59; opacity:0; transition:opacity .3s ease;
    border:1px solid var(--glass-border);
    background:var(--glass);
    backdrop-filter:blur(2px) saturate(180%) brightness(1.15);
    -webkit-backdrop-filter:blur(2px) saturate(180%) brightness(1.15);
    box-shadow:inset 0 0 40px rgba(237,237,231,0.06), 0 0 60px rgba(255,46,0,0.06);
  }

  /* ---------- SECTION LABELS & FILTERS ---------- */
  .section-head{
    display:flex; justify-content:space-between; align-items:baseline;
    padding:50px 28px 22px; border-bottom:1px solid var(--line);
    gap:16px; flex-wrap:wrap;
  }
  .section-head h2{font-size:clamp(28px,4vw,44px);}
  .section-head .eyebrow{font-size:12px;}

  /* ---------- WORK GRID ---------- */
  .work-grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    border-bottom:1px solid var(--line);
  }
  .work-item{
    grid-column:span 1;
    border-right:1px solid var(--line);
    border-bottom:1px solid var(--line);
    position:relative;
    aspect-ratio:16/10;
    overflow:hidden;
    cursor:pointer;
    transition:opacity .4s ease, transform .4s ease;
  }
  .work-item:nth-child(2n){
    border-right:none;
  }

  /* SEE MORE DROPDOWN STYLES */
  .see-more-container{
    display:flex; justify-content:center; align-items:center;
    padding:32px 28px; border-bottom:1px solid var(--line);
    background:rgba(10,10,10,0.4);
  }
  .see-more-btn{
    display:flex; align-items:center; gap:12px;
    font-family:'Space Grotesk', sans-serif; font-size:13px; font-weight:700;
    letter-spacing:0.14em; text-transform:uppercase;
    padding:14px 28px; border:1px solid var(--glass-border);
    background:var(--glass); color:var(--paper);
    transition:all .3s cubic-bezier(.2,.8,.2,1);
  }
  .see-more-btn:hover{
    border-color:var(--alarm); background:var(--glass-strong); color:var(--alarm);
  }
  .see-more-btn .chevron{
    transition:transform .3s ease; font-size:10px; color:var(--alarm);
  }
  .see-more-btn.active .chevron{
    transform:rotate(180deg);
  }

  .more-projects-wrapper{
    max-height:0; overflow:hidden; opacity:0;
    transition:max-height .6s cubic-bezier(.2,.8,.2,1), opacity .5s ease;
  }
  .more-projects-wrapper.expanded{
    max-height:2200px; opacity:1;
  }
  .more-grid{
    border-top:none;
  }
  
  .work-item .frame{
    position:absolute; inset:0;
    background:repeating-linear-gradient(135deg, #1b1b1b 0 2px, #141414 2px 26px);
    display:flex; align-items:flex-end;
    transition:filter .35s ease, transform .5s ease;
    filter:grayscale(1) contrast(1.05);
  }
  .work-item:hover .frame{filter:none; transform:scale(1.04);}
  .sheen{
    position:absolute; inset:0; pointer-events:none; z-index:1;
    background:linear-gradient(115deg, transparent 30%, rgba(255,255,255,0.16) 45%, transparent 60%);
    background-size:250% 250%; background-position:220% 220%;
    transition:background-position .9s ease;
  }
  .work-item:hover .sheen{background-position:-40% -40%;}
  
  .work-meta{
    position:relative; z-index:2; width:100%;
    padding:16px; display:flex; justify-content:space-between; align-items:flex-end;
    background:rgba(10,10,10,0.45);
    backdrop-filter:blur(4px) saturate(140%);
    -webkit-backdrop-filter:blur(4px) saturate(140%);
    border-top:1px solid transparent;
    transition:background .35s ease, backdrop-filter .35s ease, border-color .35s ease;
  }
  .work-item:hover .work-meta{
    background:rgba(10,10,10,0.7);
    backdrop-filter:blur(12px) saturate(160%);
    -webkit-backdrop-filter:blur(12px) saturate(160%);
    border-top:1px solid var(--glass-border);
  }
  .work-meta .name{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:18px; text-transform:uppercase;}
  .work-code{
    position:absolute; top:14px; left:14px; z-index:2;
    font-size:10px; color:var(--grey); letter-spacing:.1em;
    background:rgba(10,10,10,0.5); padding:3px 6px; border-radius:2px;
  }
  .work-code b{color:var(--alarm);}
  .work-view{
    position:absolute; top:14px; right:14px; z-index:2;
    font-size:10px; letter-spacing:.1em; padding:5px 9px;
    opacity:0; transform:translateY(-6px);
    transition:opacity .3s ease, transform .3s ease;
  }
  .work-item:hover .work-view{opacity:1; transform:translateY(0);}

  .placeholder-pattern {
    width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(circle, rgba(255,46,0,0.08) 0%, rgba(10,10,10,0.95) 70%);
    color: var(--grey); font-size: 11px; letter-spacing: 0.15em;
  }

  /* ---------- LIGHTBOX ---------- */
  .lightbox{position:fixed; inset:0; z-index:300; display:flex; align-items:center; justify-content:center; padding:24px; opacity:0; pointer-events:none; transition:opacity .35s ease;}
  .lightbox.open{opacity:1; pointer-events:auto;}
  .lightbox-backdrop{position:absolute; inset:0; background:rgba(6,6,6,0.82); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);}
  .lightbox-card{
    position:relative; width:min(1040px,100%); max-height:90vh; overflow:hidden;
    display:grid; grid-template-columns:1.5fr 1fr;
    transform:scale(.96) translateY(10px); transition:transform .35s cubic-bezier(.2,.8,.2,1);
    box-shadow: 0 20px 50px rgba(0,0,0,0.7);
  }
  .lightbox.open .lightbox-card{transform:scale(1) translateY(0);}
  .lightbox-frame{
    background:#050505; min-height:320px; position:relative;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .lightbox-frame video{width:100%; height:100%; object-fit:contain; max-height:75vh;}
  .lightbox-info{padding:36px; border-left:1px solid var(--glass-border); display:flex; flex-direction:column; justify-content:space-between; overflow-y:auto;}
  .lightbox-info h3{font-size:32px; margin-bottom:18px;}
  .lb-meta-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:20px; padding-bottom:20px; border-bottom:1px solid var(--glass-border);}
  .lb-meta-grid span{display:block; font-size:9px; color:var(--grey); letter-spacing:.12em; margin-bottom:4px;}
  .lb-meta-grid b{font-size:12px; font-weight:500;}
  .lightbox-info p{font-size:13px; line-height:1.75; color:#D8D8D2;}
  .lightbox-close{
    position:absolute; top:14px; right:14px; z-index:10;
    background:rgba(10,10,10,0.7); border:1px solid var(--glass-border); color:var(--paper);
    font-family:inherit; font-size:10px; letter-spacing:.1em; padding:8px 12px; transition:all .2s;
  }
  .lightbox-close:hover{background:var(--alarm); border-color:var(--alarm); color:var(--bg);}
  @media (max-width:768px){
    .lightbox-card{grid-template-columns:1fr; max-height:85vh; overflow-y:auto;} 
    .lightbox-info{border-left:none; border-top:1px solid var(--glass-border); padding:24px;}
    .lightbox-frame{min-height:220px;}
  }

  /* ---------- REEL ---------- */
  .reel{padding:0 28px 60px; border-bottom:1px solid var(--line);}
  .reel-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:24px;
    margin-top:24px;
  }
  .reel-card{
    display:flex;
    flex-direction:column;
    background:rgba(10,10,10,0.4);
    border:1px solid var(--line);
    padding:16px;
    transition:border-color .3s ease;
  }
  .reel-card:hover{
    border-color:var(--glass-border);
  }
  .reel-badge{
    font-size:10px;
    letter-spacing:0.14em;
    color:var(--alarm);
    font-weight:700;
    margin-bottom:12px;
    text-transform:uppercase;
  }
  .reel-frame{
    aspect-ratio:16/9;
    width:100%;
    position:relative;
    background:#000;
    border:1px solid var(--line);
    overflow:hidden;
  }
  .reel-meta{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-top:14px;
    font-size:11px;
    color:var(--grey);
    gap:12px;
  }
  .reel-title{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:14px;
    color:var(--paper);
    text-transform:uppercase;
    margin-bottom:4px;
  }
  .reel-yt-link{
    color:var(--alarm);
    text-decoration:underline;
    letter-spacing:0.1em;
    font-size:10px;
    white-space:nowrap;
  }

  /* ---------- ABOUT ---------- */
  .about{
    display:grid; grid-template-columns:1.3fr 1fr;
    border-bottom:1px solid var(--line);
  }
  .about-copy{padding:44px 28px; border-right:1px solid var(--line);}
  .about-copy p{font-size:15px; line-height:1.75; color:#D8D8D2; max-width:560px; margin-bottom:16px;}
  .about-copy p:first-of-type{font-family:'Space Grotesk',sans-serif; font-size:22px; font-weight:500; text-transform:none; color:var(--paper);}
  .spec-list{padding:32px; margin:24px 28px 24px 24px; border:1px solid var(--glass-border);}
  .spec-row{
    display:flex; justify-content:space-between; padding:12px 0;
    border-bottom:1px solid var(--glass-border); font-size:12px;
  }
  .spec-row:last-child{border-bottom:none;}
  .spec-row span:first-child{color:var(--grey); letter-spacing:.08em;}

  /* ---------- CAPABILITIES / CALL SHEET ---------- */
  .callsheet{border-bottom:1px solid var(--line);}
  .cs-row{
    display:grid; grid-template-columns:60px 1.4fr 1fr 1fr;
    border-bottom:1px solid var(--line);
    font-size:12px; transition:background .25s ease;
  }
  .cs-row.head{color:var(--grey); letter-spacing:.1em; font-size:10px;}
  .cs-row:not(.head):hover{background:var(--glass); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);}
  .cs-row > div{padding:16px 18px; border-right:1px solid var(--line);}
  .cs-row > div:last-child{border-right:none;}
  .cs-row .svc{font-family:'Space Grotesk',sans-serif; font-weight:700; text-transform:uppercase; letter-spacing:.02em;}

  /* ---------- CLIENTS TICKER ---------- */
  .ticker-wrap{
    border-bottom:1px solid var(--line);
    overflow:hidden; padding:22px 0;
    white-space:nowrap;
    background:rgba(10,10,10,0.5);
  }
  .ticker{
    display:inline-block;
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:20px;
    text-transform:uppercase; letter-spacing:.03em;
    animation:scroll 26s linear infinite;
  }
  .ticker span{margin:0 26px; color:#5a5a54; transition:color .2s ease;}
  .ticker span.hi{color:var(--paper);}
  .ticker span:hover{color:var(--alarm);}
  @keyframes scroll{from{transform:translateX(0);} to{transform:translateX(-50%);}}

  /* ---------- CONTACT / FOOTER ---------- */
  footer{padding:70px 28px 30px;}
  .cta-line{
    display:flex; justify-content:space-between; align-items:flex-end;
    flex-wrap:wrap; gap:20px; border-bottom:1px solid var(--line); padding-bottom:40px;
  }
  .cta-line h2{font-size:clamp(32px,7vw,84px);}
  .contact-container {
    display: flex; flex-direction: column; align-items: flex-start; gap: 24px;
  }
  .contact-block {
    display: flex; flex-direction: column; align-items: flex-start; gap: 6px;
  }
  .cta-line a.mail, .cta-line a.phone{

<script>
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const isTouch = window.matchMedia('(hover: none), (pointer: coarse)').matches;
  const isDesktop = window.matchMedia('(min-width: 861px)').matches;

  // ---------- Timecode Ticker ----------
  const tc = document.getElementById('timecode');
  const start = Date.now();
  function pad(n){return n.toString().padStart(2,'0');}
  function updateTC(){
    const elapsed = Date.now() - start;
    const totalSec = Math.floor(elapsed/1000);
    const h = Math.floor(totalSec/3600);
    const m = Math.floor((totalSec%3600)/60);
    const s = totalSec%60;
    const f = Math.floor((elapsed%1000)/1000*24);
    tc.textContent = `${pad(h)}:${pad(m)}:${pad(s)}:${pad(f)}`;
    requestAnimationFrame(updateTC);
  }
  updateTC();

  // ---------- BGM CONTROLLER & SOUNDWAVE ANIMATION ----------
  const bgmAudio = document.getElementById('bgmAudio');
  const bgmBtn = document.getElementById('bgmBtn');
  const bgmText = document.getElementById('bgmText');
  let isBgmPlaying = false;
  let bgmWasPlayingBeforeLightbox = false;
  let fadeInterval = null;
  const TARGET_VOLUME = 0.25; // Updated to 25% volume

  // Set initial volume
  bgmAudio.volume = TARGET_VOLUME;

  // Smooth Volume Fade In / Out Helper
  function fadeBgmVolume(targetVol, duration = 800, onComplete = null) {
    if (fadeInterval) clearInterval(fadeInterval);
    const startVol = bgmAudio.volume;
    const steps = 25;
    const stepTime = duration / steps;
    const volChange = (targetVol - startVol) / steps;
    let currentStep = 0;

    fadeInterval = setInterval(() => {
      currentStep++;
      let newVol = startVol + (volChange * currentStep);
      if ((volChange > 0 && newVol >= targetVol) || (volChange < 0 && newVol <= targetVol)) {
        newVol = targetVol;
        clearInterval(fadeInterval);
        if (onComplete) onComplete();
      }
      bgmAudio.volume = Math.max(0, Math.min(1, newVol));
    }, stepTime);
  }

  function playBgm() {
    bgmAudio.volume = TARGET_VOLUME;
    const playPromise = bgmAudio.play();
    if (playPromise !== undefined) {
      playPromise.then(() => {
        isBgmPlaying = true;
        bgmBtn.classList.add('active');
        bgmText.textContent = 'BGM: ON';
      }).catch(err => {
        console.warn('Autoplay blocked by browser policy:', err);
        isBgmPlaying = false;
        bgmBtn.classList.remove('active');
        bgmText.textContent = 'BGM: OFF';
      });
    }
  }

  function pauseBgm(fade = true) {
    if (!isBgmPlaying) return;
    isBgmPlaying = false;
    bgmBtn.classList.remove('active');
    bgmText.textContent = 'BGM: OFF';
    
    if (fade) {
      fadeBgmVolume(0, 600, () => bgmAudio.pause());
    } else {
      bgmAudio.pause();
      bgmAudio.volume = 0;
    }
  }

  function toggleBgm() {
    if (isBgmPlaying) {
      pauseBgm(true);
    } else {
      playBgm();
    }
  }

  bgmBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    toggleBgm();
  });

  // Enable audio on first user touch/click/key interaction
  function handleFirstUserGesture() {
    if (!isBgmPlaying) {
      playBgm();
    }
    ['click', 'touchstart', 'keydown', 'pointerdown'].forEach(evt => {
      document.removeEventListener(evt, handleFirstUserGesture);
    });
  }

  ['click', 'touchstart', 'keydown', 'pointerdown'].forEach(evt => {
    document.addEventListener(evt, handleFirstUserGesture, { once: true });
  });

  // Optional: Auto-start background music on first user click anywhere on page
  function handleFirstUserGesture() {
    if (!isBgmPlaying && bgmAudio.paused) {
      playBgm();
    }
    document.removeEventListener('click', handleFirstUserGesture);
  }
  document.addEventListener('click', handleFirstUserGesture, { once: true });


  // ---------- Custom Glass Cursor ----------
  const cursorDot = document.getElementById('cursorDot');
  const cursorRing = document.getElementById('cursorRing');
  let ringX = window.innerWidth/2, ringY = window.innerHeight/2, mouseX = ringX, mouseY = ringY;

  if(isDesktop && !isTouch){
    document.addEventListener('mousemove', (e)=>{
      mouseX = e.clientX; mouseY = e.clientY;
      cursorDot.style.left = mouseX+'px'; cursorDot.style.top = mouseY+'px';
      cursorDot.style.opacity = 1; cursorRing.style.opacity = 1;
    });
    document.addEventListener('mouseleave', ()=>{cursorDot.style.opacity=0; cursorRing.style.opacity=0;});
    function ringLoop(){
      ringX += (mouseX-ringX)*0.18;
      ringY += (mouseY-ringY)*0.18;
      cursorRing.style.left = ringX+'px'; cursorRing.style.top = ringY+'px';
      requestAnimationFrame(ringLoop);
    }
    ringLoop();
    document.querySelectorAll('a, button, .work-item').forEach(el=>{
      el.addEventListener('mouseenter', ()=>cursorRing.classList.add('hover'));
      el.addEventListener('mouseleave', ()=>cursorRing.classList.remove('hover'));
    });
  } else {
    document.body.classList.remove('no-cursor');
  }

  // ---------- Viewfinder Lens & Brackets ----------
  const hero = document.getElementById('hero');
  const lens = document.getElementById('lens');
  const brackets = [document.getElementById('btl'),document.getElementById('btr'),document.getElementById('bbl'),document.getElementById('bbr')];

  if(isDesktop && !isTouch && !reduceMotion){
    hero.addEventListener('mousemove', (e)=>{
      const size = 90;
      const x = e.clientX, y = e.clientY;
      brackets[0].style.left=(x-size/2)+'px'; brackets[0].style.top=(y-size/2)+'px'; brackets[0].style.opacity=1;
      brackets[1].style.left=(x+size/2-26)+'px'; brackets[1].style.top=(y-size/2)+'px'; brackets[1].style.opacity=1;
      brackets[2].style.left=(x-size/2)+'px'; brackets[2].style.top=(y+size/2-26)+'px'; brackets[2].style.opacity=1;
      brackets[3].style.left=(x+size/2-26)+'px'; brackets[3].style.top=(y+size/2-26)+'px'; brackets[3].style.opacity=1;
      lens.style.left=x+'px'; lens.style.top=y+'px'; lens.style.transform='translate(-50%,-50%)'; lens.style.opacity=1;
      hero.style.backgroundPosition = `${-(x*0.02)}px ${-(y*0.02)}px`;
    });
    hero.addEventListener('mouseleave', ()=>{
      brackets.forEach(b=>b.style.opacity=0);
      lens.style.opacity=0;
    });
  }

  // ---------- See More Dropdown Toggle ----------
  const seeMoreBtn = document.getElementById('seeMoreBtn');
  const moreProjectsWrapper = document.getElementById('moreProjectsWrapper');

  seeMoreBtn.addEventListener('click', () => {
    const isExpanded = seeMoreBtn.getAttribute('aria-expanded') === 'true';
    if (isExpanded) {
      moreProjectsWrapper.classList.remove('expanded');
      seeMoreBtn.classList.remove('active');
      seeMoreBtn.setAttribute('aria-expanded', 'false');
      seeMoreBtn.querySelector('span:first-child').textContent = 'SEE MORE PROJECTS (4)';
    } else {
      moreProjectsWrapper.classList.add('expanded');
      seeMoreBtn.classList.add('active');
      seeMoreBtn.setAttribute('aria-expanded', 'true');
      seeMoreBtn.querySelector('span:first-child').textContent = 'HIDE EXTRA PROJECTS';
    }
  });

  // ---------- Mobile Glass Menu ----------
  const mobileMenu = document.getElementById('mobileMenu');
  document.getElementById('menuOpen').addEventListener('click', ()=>mobileMenu.classList.add('open'));
  document.getElementById('menuClose').addEventListener('click', ()=>mobileMenu.classList.remove('open'));
  mobileMenu.querySelectorAll('a').forEach(a=>a.addEventListener('click', ()=>mobileMenu.classList.remove('open')));

  // ---------- Scroll Reveal ----------
  const revealEls = document.querySelectorAll('.reveal');
  const io = new IntersectionObserver((entries)=>{
    entries.forEach((entry, i)=>{
      if(entry.isIntersecting){
        setTimeout(()=>entry.target.classList.add('in-view'), i*40);
        io.unobserve(entry.target);
      }
    });
  }, {threshold:0.12});
  revealEls.forEach(el=>io.observe(el));

  // ---------- Magnetic Button ----------
  function magnetize(el, strength){
    if(!el) return;
    el.addEventListener('mousemove', (e)=>{
      const r = el.getBoundingClientRect();
      const x = e.clientX - r.left - r.width/2;
      const y = e.clientY - r.top - r.height/2;
      el.style.transform = `translate(${x*strength}px, ${y*strength}px)`;
    });
    el.addEventListener('mouseleave', ()=>{el.style.transform='translate(0,0)';});
  }
  if(isDesktop && !isTouch && !reduceMotion){
    magnetize(document.getElementById('mailLink'), 0.25);
    magnetize(document.getElementById('phoneLink'), 0.25);
  }

  // ---------- Interactive Lightbox Player ----------
  const lightbox = document.getElementById('lightbox');
  const lbFrame = document.getElementById('lbFrame');
  const lbFields = {
    title: document.getElementById('lbTitle'),
    role: document.getElementById('lbRole'),
    year: document.getElementById('lbYear'),
    format: document.getElementById('lbFormat'),
    desc: document.getElementById('lbDesc'),
  };

  function openLightbox(item){
    // Pause background music during lightbox video playback so audio doesn't clash!
    if (isBgmPlaying) {
      bgmWasPlayingBeforeLightbox = true;
      pauseBgm(true);
    } else {
      bgmWasPlayingBeforeLightbox = false;
    }

    lbFields.title.textContent = item.dataset.title;
    lbFields.role.textContent = item.dataset.role;
    lbFields.year.textContent = item.dataset.year;
    lbFields.format.textContent = item.dataset.format;
    lbFields.desc.textContent = item.dataset.desc;

    lbFrame.innerHTML = '';
    const videoSrc = item.dataset.video;
    
    if(videoSrc && videoSrc.trim() !== '') {
      const vid = document.createElement('video');
      vid.controls = true;
      vid.autoplay = true;
      vid.playsInline = true;
      const src = document.createElement('source');
      src.src = videoSrc;
      src.type = 'video/mp4';
      vid.appendChild(src);
      lbFrame.appendChild(vid);
    } else {
      lbFrame.innerHTML = '<div class="placeholder-pattern"><span>[ PREVIEW NOT AVAILABLE ]</span></div>';
    }

    lightbox.classList.add('open');
    lightbox.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox(){
    lightbox.classList.remove('open');
    lightbox.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    lbFrame.innerHTML = '';

    // Resume background music if it was active before opening lightbox
    if (bgmWasPlayingBeforeLightbox) {
      playBgm();
    }
  }

  const allWorkItems = document.querySelectorAll('.work-item');
  allWorkItems.forEach(item=>{
    item.addEventListener('click', ()=>openLightbox(item));
    item.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') openLightbox(item); });
  });

  document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
  document.getElementById('lightboxBackdrop').addEventListener('click', closeLightbox);
  document.addEventListener('keydown', (e)=>{if(e.key==='Escape') closeLightbox();});

  // ---------- Toast & Copy Email ----------
  const toast = document.getElementById('toast');
  const copyBtn = document.getElementById('copyEmailBtn');

  function triggerToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2800);
  }

  copyBtn.addEventListener('click', () => {
    navigator.clipboard.writeText('joychakrabarty24@gmail.com').then(() => {
      triggerToast('EMAIL COPIED TO CLIPBOARD');
    });
  });
</script>
